# /opt/onyx/config/hardening.yml
# LINEAR EXECUTION ORDER: FOUNDATION -> STEALTH -> RETALIATION
hardening:
  persona: "apple"              # Options: 'apple', 'windows', 'linux'

  interfaces:
    hotspot: "uap0"             # Standard Onyx hotspot interface
    tunnel: "wg0"               # Primary WireGuard tunnel
  
  # --- PHASE 1: FOUNDATION (The "Keep-Alive" Rules) ---
  foundation:
    default_deny: true           # Set policy to DROP
    established_related: true    # Allows return traffic for ongoing work
    localhost_access: true       # Essential for loopback (lo) and system IPC
    dhcp_access: true           # Permits hotspot client IP assignment
    rfc1918_access: true        # Allows local subnet communication
    vpn_transport: true         # Permits physical exit to VPN endpoint
    tunnel_integrity: true      # Protects traffic within the wg0 tunnel

  # --- PHASE 2: SYSTEM & KERNEL STEALTH ---
  system:
    use_zram: false              # Optimizes RAM for Pi Zero performance
    forensic_zero: false         # Moves logs to RAM disk to prevent forensics
    dark_mode: false             # Disables physical LED indicators
    browser_scrubbing: false    # Toggles Browser Identity Scrubber (Privoxy)
    bluetooth_locked: false      # Disables Bluetooth hardware at kernel level
    mac_stealth: false          # Toggles wlan0 MAC randomization
    mac_blend: "off"          # Options: "apple", "samsung", "intel", "random", "off"
    ttl_masking: "windows"      # Appears as Windows stack at the packet level
  
  kernel:
    tcp_timestamps: true # Disables TCP Timestamps to hide uptime
    qname_minimization: true          # Enables DNS QNAME Minimization
    icmp_echo_ignore: true           # Ignores ICMP broadcasts and bogus errors
    icmp_ratelimit: true     # Rate-limits ICMP responses against scanning
    arp_guard: true              # Implements Neighbor Table Stealth
    rp_filter: true          # Enforces Strict Reverse Path Filtering
    tcp_syncookies: true       # Enables TCP SYN Cookies
    kernel_sysrq: true        # Disables SysRq and forces rapid reboot on panic
    log_martians: true           # Logs packets with impossible source addresses
    ip_forwarding: true          # Required for router functionality
    disable_ipv6: true           # Prevents IPv6 leaks and address discovery
    ignore_redirects: true       # Disables ICMP Redirect acceptance
    no_send_redirects: true      # Disables sending of ICMP Redirects

  # --- PHASE 3: ACTIVE DEFENSE & TRAFFIC OBFUSCATION ---
  network:
    hardware_reactive: false      # Locks down new network hardware via udev
    safety_net: false             # Periodically enforces firewall ruleset
    sentinel_trap: false          # Deploys Honeypot ports (TARPIT or RESET)
    tarpit_trap: false           # Heavy defense (requires specific kernel modules)
    geo_blocking: false           # Blocks foreign traffic via ipset
    unbound_filtered: false       # Enforces Sentinel DNS blocklists
    telemetry_blackout: false     # Blocks metrics/analytics strings in packets
    mtu_stealth: false            # Clamps TCP MSS to prevent oversized packets
    webrtc_lockdown: false        # Blocks STUN/TURN traffic to prevent IP leaks
    port_scrambling: false        # Randomizes source ports via MASQUERADE
    ghost_host: false             # Kills mDNS and LLMNR discovery broadcasts
    syn_proxy: false              # Protects against SYN flood attacks
    bogom_filter: false           # Drops malformed protocol flag combinations
    packet_padding: false        # Obfuscates size/timing (High performance cost)
    isolation_barrier: false      # Prevents VLAN cross-talk