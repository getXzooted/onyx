server:
    # Listening Info
    verbosity: 0
    interface: 127.0.0.1
    port: 5335
    ${HINTS_CONF}
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    
    # Privacy & Security
    do-ip6: no
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    edns-buffer-size: 1232
    prefetch: yes
    
    # Pi Zero Resource Limits (Low RAM)
    num-threads: 1
    msg-cache-slabs: 2
    rrset-cache-slabs: 2
    infra-cache-slabs: 2
    key-cache-slabs: 2
    rrset-cache-size: 50m
    msg-cache-size: 25m
    so-rcvbuf: 1m