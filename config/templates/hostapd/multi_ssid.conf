# --- PRIMARY BSS ({{MAIN_NAME}}) ---
interface={{PARENT}}
driver=nl80211
ssid={{MAIN_SSID}}
hw_mode=g
channel=7
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase={{MAIN_PASS}}
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP

# --- VIRTUAL BSS ({{VLAN_NAME}}) ---
bss={{VLAN_NAME}}
ssid={{VLAN_SSID}}
wpa=2
wpa_passphrase={{VLAN_PASS}}
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP